<!DOCTYPE html>
<html>
  <head>
    <title>Audio Check</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
    <script type="text/javascript" src="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheck.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheckStyle.css">

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      #intro {
        max-width: 600px;
        text-align: center;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }

      #hc-container {
        max-width: 600px;
        width: 100%;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
    </style>

    <script>
      $(document).ready(function() {

        $(document).on('hcHeadphoneCheckEnd', function(event, data) {
          var didPass = data.didPass;
          if (didPass) {
            window.location.href = "https://qualtricsxmyjpbgm848.qualtrics.com/jfe/form/SV_1RiR2W7ImQC6Qf4?headphone=passed";
          } else {
            window.location.href = "https://qualtricsxmyjpbgm848.qualtrics.com/jfe/form/SV_1RiR2W7ImQC6Qf4?headphone=failed";
          }
        });

        HeadphoneCheck.runHeadphoneCheck({doCalibration: false});

      });
    </script>
  </head>
  <body>

    <div id="intro">
      <h2>Audio Equipment Check</h2>
      <p>Before the study begins, we need to confirm your audio setup is working correctly.</p>
      <p><strong>Please put on your headphones now</strong> before pressing Play.</p>
    </div>

    <div id="hc-container"></div>

  </body>
</html>
