<!DOCTYPE html>
<html>
  <head>
    <title>Audio Check</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
    <script type="text/javascript" src="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheck.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://s3.amazonaws.com/mcd-headphone-check/v1.0/src/HeadphoneCheckStyle.css">

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      #intro {
        max-width: 600px;
        text-align: center;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }

      #hc-container {
        max-width: 600px;
        width: 100%;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
    </style>

    <script>
$(document).ready(function() {
  // Read the parameters Prolific appended to this page's URL
  var urlParams = new URLSearchParams(window.location.search);
  var prolificId = urlParams.get('PROLIFIC_PID') || '';
  var studyId = urlParams.get('STUDY_ID') || '';
  var sessionId = urlParams.get('SESSION_ID') || '';

  // Your SoSci survey's base URL
  var soSciBaseUrl = "https://www.soscisurvey.de/Main_study/";

  $(document).on('hcHeadphoneCheckEnd', function(event, data) {
    var didPass = data.didPass;
    var headphoneStatus = didPass ? "passed" : "failed";

    var redirectUrl = soSciBaseUrl 
      + "?PROLIFIC_PID=" + encodeURIComponent(prolificId)
      + "&STUDY_ID=" + encodeURIComponent(studyId)
      + "&SESSION_ID=" + encodeURIComponent(sessionId)
      + "&headphone=" + headphoneStatus;

    window.location.href = redirectUrl;
  });
  HeadphoneCheck.runHeadphoneCheck({doCalibration: false});
});
    </script>
  </head>
  <body>

    <div id="intro">
      <h2>Audio Equipment Check</h2>
      <p>Before the study begins, we need to confirm your audio setup is working correctly.</p>
      <p><strong>Please put on your headphones now</strong> before pressing Play.</p>
    </div>

    <div id="hc-container"></div>

  </body>
</html>
